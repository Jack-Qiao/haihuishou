<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>嗨回收抢单试用工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e6edf3;
      --text-muted: #8b9cb3;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --primary: #22c55e;
      --danger: #ef4444;
      --radius: 10px;
      --font: 'Noto Sans SC', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
    }

    /* 全局滚动条：与主题一致 */
    html,
    body,
    .grab-left,
    .grab-right,
    .schedule-left,
    #scheduleTaskListContainer,
    .table-wrap {
      scrollbar-color: var(--border) var(--surface);
      scrollbar-width: thin;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .grab-left::-webkit-scrollbar,
    .grab-right::-webkit-scrollbar,
    .schedule-left::-webkit-scrollbar,
    #scheduleTaskListContainer::-webkit-scrollbar,
    .table-wrap::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    html::-webkit-scrollbar-track,
    body::-webkit-scrollbar-track,
    .grab-left::-webkit-scrollbar-track,
    .grab-right::-webkit-scrollbar-track,
    .schedule-left::-webkit-scrollbar-track,
    #scheduleTaskListContainer::-webkit-scrollbar-track,
    .table-wrap::-webkit-scrollbar-track {
      background: var(--surface);
      border-radius: 4px;
    }

    html::-webkit-scrollbar-thumb,
    body::-webkit-scrollbar-thumb,
    .grab-left::-webkit-scrollbar-thumb,
    .grab-right::-webkit-scrollbar-thumb,
    .schedule-left::-webkit-scrollbar-thumb,
    #scheduleTaskListContainer::-webkit-scrollbar-thumb,
    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    html::-webkit-scrollbar-thumb:hover,
    body::-webkit-scrollbar-thumb:hover,
    .grab-left::-webkit-scrollbar-thumb:hover,
    .grab-right::-webkit-scrollbar-thumb:hover,
    .schedule-left::-webkit-scrollbar-thumb:hover,
    #scheduleTaskListContainer::-webkit-scrollbar-thumb:hover,
    .table-wrap::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    #appContent {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }

    #tabPanelGrab {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .grab-layout {
      display: flex;
      flex: 1;
      gap: 0;
      align-items: stretch;
      min-height: 0;
      width: 100%;
    }

    .grab-left {
      flex: 0 0 31%;
      min-width: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow: auto;
    }

    .grab-right {
      flex: 1 1 69%;
      min-width: 0;
      background: var(--surface);
      padding: 16px;
      overflow: auto;
    }

    #tabPanelSchedule {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .schedule-layout {
      display: flex;
      flex: 1;
      gap: 0;
      align-items: stretch;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }

    .schedule-left {
      flex: 0 0 45%;
      min-width: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow: auto;
    }

    .schedule-right {
      flex: 1 1 55%;
      min-width: 0;
      background: var(--surface);
      padding: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .schedule-right>section {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
    }

    .header-title-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .trial-countdown {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #f59e0b;
    }

    #loginCountdown {
      margin: 8px 0 0 0;
      display: inline-block;
    }

    .main-tabs {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .tab-nav {
      display: flex;
      gap: 0;
      max-width: 1200px;
      margin: 0 16px;
      padding: 0 0;
    }

    .tab-nav-item {
      padding: 14px 20px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-nav-item:hover {
      color: var(--text);
    }

    .tab-nav-item.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-nav-item.disabled {
      color: var(--text-muted);
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }

    .tab-panel {
      display: block;
    }

    .tab-panel.hidden {
      display: none;
    }

    .login-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--border);
      color: var(--text);
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 12px;
    }

    .status {
      color: var(--text-muted);
      font-size: 13px;
    }

    .status.logged-in {
      color: var(--accent);
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      /* margin-top: 20px; */
      padding: 20px;
    }

    section h2 {
      margin: 0 0 16px 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .form-row label {
      min-width: 80px;
      color: var(--text-muted);
    }

    .form-row-max-quote {
      align-items: center;
      gap: 8px;
    }

    .form-row-max-quote .input-max-quote {
      width: 100px;
    }

    .max-quote-hint {
      color: var(--text-muted);
      font-size: 13px;
    }

    .max-quote-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }

    .max-quote-check.hidden {
      display: none !important;
    }

    .form-row input:not([type="checkbox"]):not([type="radio"]),
    .form-row select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      min-width: 120px;
    }

    /* 覆盖浏览器自动填充的浅色背景，与最低价等输入框保持一致 */
    .form-row input:-webkit-autofill,
    .form-row input:-webkit-autofill:hover,
    .form-row input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
      box-shadow: 0 0 0 1000px var(--bg) inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    .brands-collapsible-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .brands-collapsible-toggle:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .brands-collapsible-toggle .collapse-icon {
      font-size: 10px;
      transition: transform 0.2s ease;
    }

    .brands-collapsible.expanded .brands-collapsible-toggle .collapse-icon {
      transform: rotate(180deg);
    }

    .brands-collapsible-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease-out;
    }

    .brands-collapsible.expanded .brands-collapsible-body {
      max-height: 70vh;
    }

    .brands-collapsible-body .brands-chosen {
      margin-top: 0;
    }

    .brands-chosen {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .tag {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: var(--text);
    }

    .tag input[type="checkbox"],
    .tag input[type="radio"] {
      margin: 0;
      flex-shrink: 0;
      cursor: pointer;
    }

    .tag input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      min-width: 12px;
      min-height: 12px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--bg);
      box-sizing: border-box;
    }

    .tag input[type="checkbox"]:checked {
      background: #fff;
      border-color: #fff;
    }

    .tag:has(input[type="checkbox"]:checked),
    .tag:has(input[type="radio"]:checked) {
      border-color: var(--primary);
      background: rgba(34, 197, 94, 0.12);
    }

    .tag input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      min-width: 12px;
      min-height: 12px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--bg);
      box-sizing: border-box;
    }

    .tag input[type="radio"]:checked {
      background: #3b82f6;
      border-color: #3b82f6;
    }

    .order-state-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .order-state-row .order-state-label {
      color: var(--text-muted);
      font-size: 14px;
      min-width: 72px;
    }

    .grab-filter-section {
      margin-top: 18px;
    }

    .grab-filter-section-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .grab-filter-section-title {
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .order-state-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .order-state-option:hover {
      border-color: var(--primary);
      background: rgba(34, 197, 94, 0.08);
    }

    .order-state-option input {
      margin: 0;
      accent-color: var(--primary);
    }

    .order-state-option:has(input:checked) {
      border-color: var(--primary);
      background: rgba(34, 197, 94, 0.12);
    }

    .pagination-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .pagination-total {
      color: var(--text-muted);
      font-size: 13px;
      margin-right: auto;
    }

    .pagination-nav {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pagination-btn {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pagination-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .pagination-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination-ellipsis {
      padding: 0 4px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .pagination-size,
    .pagination-jump input {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .pagination-jump {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .pagination-jump input {
      width: 48px;
      text-align: center;
    }

    .section-collapsible h2 {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-collapsible h2 .collapse-icon {
      font-size: 12px;
      color: var(--text-muted);
    }

    .section-collapsible.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    .section-collapsible .section-collapse-body {
      max-height: 80vh;
      overflow: hidden;
      transition: max-height 0.25s ease-out;
    }

    .section-collapsible.collapsed .section-collapse-body {
      max-height: 0 !important;
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
    }

    tr:hover {
      background: rgba(34, 197, 94, 0.06);
    }

    .msg {
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .msg.error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .msg.success {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
    }

    .msg.info {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
    }

    .hidden {
      display: none !important;
    }

    .schedule-input-error {
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.08) !important;
    }

    .schedule-conditions-wrap {
      width: 100%;
      max-width: 520px;
    }

    .schedule-conditions-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .schedule-conditions-table thead th {
      text-align: left;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .schedule-conditions-table thead th.schedule-cond-th-action {
      width: 72px;
      text-align: right;
    }

    .schedule-conditions-table tbody td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .schedule-conditions-table tbody tr:last-child td {
      border-bottom: none;
    }

    .schedule-conditions-table .schedule-cond-quote {
      width: 100%;
      min-width: 80px;
      max-width: 100px;
      box-sizing: border-box;
    }

    .schedule-conditions-table .schedule-cond-model {
      width: 100%;
      min-width: 100px;
      box-sizing: border-box;
    }

    .schedule-conditions-table .schedule-cond-storage {
      width: 100%;
      min-width: 80px;
      max-width: 100px;
      box-sizing: border-box;
    }

    .schedule-conditions-table .schedule-cond-remove {
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 13px;
    }

    .schedule-conditions-table .schedule-cond-remove:hover {
      color: var(--danger);
    }

    .schedule-conditions-table td.schedule-cond-td-action {
      text-align: right;
    }

    .schedule-conditions-table tbody tr.schedule-condition-row-error td {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .schedule-conditions-table tbody tr.schedule-condition-row-error .schedule-cond-quote,
    .schedule-conditions-table tbody tr.schedule-condition-row-error .schedule-cond-model,
    .schedule-conditions-table tbody tr.schedule-condition-row-error .schedule-cond-storage {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.06);
    }

    .schedule-condition-title {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .schedule-condition-hint-inline {
      font-size: 12px;
      font-weight: 400;
      color: #f87171;
    }


    #orderListBody .btn-small {
      margin-right: 6px;
    }

    .schedule-task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .schedule-task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .schedule-task-card-head {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .schedule-task-card-body {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .schedule-task-card-body-line {
      margin-bottom: 4px;
    }

    .schedule-task-card-body-line:last-child {
      margin-bottom: 0;
    }

    .schedule-task-card-body-line.schedule-task-card-sub {
      font-size: 11px;
      opacity: 0.95;
    }

    .schedule-task-conditions-block {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .schedule-task-condition-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text);
    }

    .schedule-task-condition-line:last-child {
      margin-bottom: 0;
    }

    .schedule-task-condition-label {
      flex-shrink: 0;
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      background: var(--border);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    .schedule-task-condition-detail {
      flex: 1;
      min-width: 0;
      color: var(--text-muted);
    }

    .schedule-task-conditions-toggle {
      flex-shrink: 0;
      margin-left: auto;
      padding: 2px 0;
      font-size: 12px;
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
    }

    .schedule-task-conditions-toggle:hover {
      text-decoration: underline;
    }

    .schedule-task-conditions-more {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }

    .schedule-task-conditions-more.expanded {
      max-height: 500px;
    }

    .schedule-task-card-actions .btn-small {
      margin-right: 8px;
    }

    .schedule-list-sticky-header {
      flex-shrink: 0;
      background: var(--surface);
      padding: 0 0 12px 0;
    }

    #scheduleTaskListContainer {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      padding-right: 8px;
      border-radius: 0 0 8px 8px;
    }

    .schedule-task-count {
      color: var(--text-muted);
      font-size: 0.9em;
      font-weight: 400;
    }

    .schedule-grabbed-count {
      color: var(--text-muted);
      font-size: 14px;
      margin: 8px 0 12px 12px;
    }

  <script>
    (function () {
      var TRIAL_SECONDS = 600;
      var endTime = Date.now() + TRIAL_SECONDS * 1000;
      var elLogin = document.getElementById('loginCountdownTime');
      var elHeader = document.getElementById('headerCountdownTime');
      var wrapLogin = document.getElementById('loginCountdown');
      var wrapHeader = document.getElementById('headerCountdown');
      function format(t) {
        var m = Math.floor(t / 60);
        var s = t % 60;
        return (String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'));
      }
      function onEnd() {
      }
      function setTime(t) {
        if (elLogin) elLogin.textContent = format(t);
        if (elHeader) elHeader.textContent = format(t);
      }
      function tick() {
        var remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        setTime(remaining);
        if (remaining <= 0) {
          clearInterval(tid);
          onEnd();
        }
      }
      tick();
      var tid = setInterval(tick, 1000);
    })();
    let authToken = '';
    let authUserId = '';
    const api = async (path, options = {}) => {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (authToken) headers['token'] = authToken;
      const res = await fetch(path, { ...options, headers });
      if (res.status === 401) {
        authToken = '';
        authUserId = '';
        if (typeof stopAllScheduleTimers === 'function') stopAllScheduleTimers();
        setLoginScreen(true);
        return { success: false, message: '请重新登录' };
      }
      const text = await res.text();
      try { return text ? JSON.parse(text) : {}; } catch (_) {
        return { success: false, message: '服务器返回异常，请检查是否已登录或刷新重试' };
      }
    };
    function showMsg(el, text, type) {
      if (!el) return;
      el.textContent = text;
      el.className = 'msg ' + (type || 'info');
      el.classList.remove('hidden');
      if (el.id === 'scheduleMsg') {
        var hint = document.getElementById('scheduleConditionHint');
        if (hint) {
          hint.textContent = text;
          if (text) hint.classList.remove('hidden');
          else {
            hint.classList.add('hidden');
            if (typeof updateScheduleSaveButtonState === 'function') updateScheduleSaveButtonState();
          }
        }
      }
    }
    function hideMsg(el) {
      if (!el) return;
      el.classList.add('hidden');
      if (el.id === 'scheduleMsg') {
        var hint = document.getElementById('scheduleConditionHint');
        if (hint) { hint.classList.add('hidden'); hint.textContent = ''; if (typeof updateScheduleSaveButtonState === 'function') updateScheduleSaveButtonState(); }
      }
    }
    function copyToClipboard(text) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function () {
          var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        });
      } else {
        var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      }
    }
    let toastTimer = null;
    function showToast(text, type, options) {
      const wrap = document.getElementById('toastWrap') || (() => {
        const w = document.createElement('div');
        w.id = 'toastWrap';
        w.className = 'toast-wrap';
        document.body.appendChild(w);
        return w;
      })();
      if (toastTimer) clearTimeout(toastTimer);
      wrap.innerHTML = '';
      const el = document.createElement('div');
      el.className = 'toast ' + (type || 'success');
      if (options && options.highlight !== undefined && options.highlight !== '') {
        var h = String(options.highlight);
        var idx = text.indexOf(h);
        var escaped = h.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        el.innerHTML = (idx >= 0)

    function updatePagination(totalCount, pageSize, currentPage) {
      var totalPages = Math.max(1, Math.ceil(totalCount / pageSize) || 1);
      var page = Math.max(1, Math.min(currentPage, totalPages));
      document.getElementById('inputPage').value = page;
      var sizeSelect = document.getElementById('inputPageSize');
      if (sizeSelect.value !== String(pageSize)) sizeSelect.value = String(pageSize);
      document.getElementById('btnPagePrev').disabled = page <= 1;
      document.getElementById('btnPageNext').disabled = page >= totalPages;
      var container = document.getElementById('paginationPages');
      container.innerHTML = '';
      function addPageBtn(p) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pagination-btn' + (p === page ? ' active' : '');
        btn.textContent = p;
        btn.dataset.page = String(p);
        container.appendChild(btn);
      }
      function addEllipsis() {
        var ell = document.createElement('span');
        ell.className = 'pagination-ellipsis';
        ell.textContent = '...';
        container.appendChild(ell);
      }
      if (totalPages <= 7) {
        for (var i = 1; i <= totalPages; i++) addPageBtn(i);
      } else {
        addPageBtn(1);
        if (page > 3) addEllipsis();
        for (var i = Math.max(2, page - 1); i <= Math.min(totalPages - 1, page + 1); i++) addPageBtn(i);
        if (page + 1 < totalPages - 1) addEllipsis();
        if (totalPages > 1) addPageBtn(totalPages);
      }
      container.querySelectorAll('.pagination-btn').forEach(function (btn) {
        btn.onclick = function () { document.getElementById('inputPage').value = btn.dataset.page; doQueryOrders(); };
      });
    }

        var modelOk = c.modelName && c.modelName.trim().length > 0;

      if (nonEmptyRows.length === 0) {

      }

          duplicateRowIndices.push(modelStorageToFirstIndex[compositeKey]);
        } else {
          modelStorageToFirstIndex[compositeKey] = nonEmptyRows[j].index;
        }
      }
      duplicateRowIndices = duplicateRowIndices.filter(function (v, i, a) { return a.indexOf(v) === i; });
      var brandsLower = [];

      var message = '';

      } else if (requiredInvalidIndices.length > 0) {

      if (!conds.length) { showToast('请先添加至少一条抢单条件', 'error'); return; }
      var invalid = conds.find(function (c) { var q = parseFloat(c.quoteAmount); return !c.modelName || isNaN(q) || q < 1 || q > 500; });
      if (invalid) { showToast('每条条件须包含机型且报价 1～500 元', 'error'); return; }
      if (scheduleTaskTimers[taskId]) { showToast('该任务已在自动执行中', 'error'); return; }
      if (scheduleTaskStarting[taskId]) return;
      var sec = Math.max(1, parseInt(task.frequency, 10) || 1);
      scheduleTaskStarting[taskId] = true;
      renderScheduleTaskList();
      try {
        await executeScheduleTask(taskId, true);
        scheduleTaskTimers[taskId] = setInterval(function () {
          if (!scheduledTasks.find(function (t) { return t.id === taskId; })) {
            stopScheduleTaskAuto(taskId);
            return;
          }
          executeScheduleTask(taskId, true);
        }, sec * 1000);
        updateScheduleGrabbedCountTimer();
        showToast('已开始自动执行「' + (task.name || '') + '」，每 ' + sec + ' 秒执行一次', 'success');
      } finally {
        delete scheduleTaskStarting[taskId];
        renderScheduleTaskList();
      }
    }
    function stopScheduleTaskAuto(taskId, silent) {
      if (scheduleTaskTimers[taskId]) {
        clearInterval(scheduleTaskTimers[taskId]);
        delete scheduleTaskTimers[taskId];
        updateScheduleGrabbedCountTimer();
        renderScheduleTaskList();
        if (!silent) showToast('已停止自动执行', 'success');
      }
    }
    document.getElementById('btnScheduleStartAll').onclick = function () {
      var toStart = scheduledTasks.filter(function (t) { return !scheduleTaskTimers[t.id] && !scheduleTaskStarting[t.id]; });
      if (toStart.length === 0) { showToast('没有可启动的任务或已在执行中', 'error'); return; }
      toStart.forEach(function (t) { startScheduleTaskAuto(t.id); });
      showToast('已发起 ' + toStart.length + ' 个任务启动', 'success');
    };
    document.getElementById('btnScheduleStopAll').onclick = function () {
      var running = scheduledTasks.filter(function (t) { return scheduleTaskTimers[t.id]; });
      if (running.length === 0) { showToast('当前没有正在执行的任务', 'error'); return; }
      running.forEach(function (t) { stopScheduleTaskAuto(t.id, true); });
      showToast('已暂停全部 ' + running.length + ' 个任务', 'success');
    };
    document.getElementById('btnScheduleDeleteAll').onclick = function () {
      if (scheduledTasks.length === 0) { showToast('暂无任务', 'error'); return; }
      if (!confirm('确定要删除全部 ' + scheduledTasks.length + ' 个任务吗？')) return;
      for (var id in scheduleTaskTimers) { if (scheduleTaskTimers.hasOwnProperty(id)) { clearInterval(scheduleTaskTimers[id]); } }
      scheduleTaskTimers = {};
      scheduleTaskStarting = {};
      scheduledTasks = [];
      saveScheduledTasks();
      clearScheduleEditMode();
      showToast('已删除全部任务', 'success');
    };
    async function executeScheduleTask(taskId, isAuto) {
      var task = scheduledTasks.find(function (t) { return t.id === taskId; });
      if (!task) { if (!isAuto) showToast('任务不存在', 'error'); return; }
      var msg = document.getElementById('scheduleMsg');
      if (!isAuto) hideMsg(msg);
      var conds = task.conditions && task.conditions.length ? task.conditions : [];
      if (!conds.length && (task.quoteAmount || task.modelName)) {
        conds = [{ quoteAmount: task.quoteAmount, modelName: task.modelName, storage: task.storage }];
      }
      try {
        var r = await api('/api/execute-task', {
          method: 'POST',
          body: JSON.stringify({
            taskName: task.name,
            manufacturerNames: task.manufacturerNames,
            categoryId: task.categoryId,
            brandIds: task.brandIds,
            minPrice: task.minPrice,
            maxPrice: task.maxPrice,
            conditions: conds,
            userId: authUserId
          })
        });
        if (r.success && r.data) {
          var d = r.data;
          var text = '共 ' + (d.total || 0) + ' 条，抢单 ' + (d.grabbed || 0) + '，报价 ' + (d.quoted || 0);
          if (!isAuto) {
            showMsg(msg, '执行完成：' + text + (d.errors && d.errors.length ? '；部分失败见控制台' : ''), 'success');
          }
          if (d.errors && d.errors.length) console.warn('execute-task errors', d.errors);
        } else {
          if (isAuto) showToast(r.message || '执行失败', 'error');
          else showMsg(msg, r.message || '执行失败', 'error');
        }
      } catch (e) {
        if (isAuto) showToast(String(e), 'error');
        else showMsg(msg, String(e), 'error');
      }
    }
    async function loadScheduleGrabbedCount() {
      var numEl = document.getElementById('scheduleGrabbedCountNum');
      var wrapEl = document.getElementById('scheduleGrabbedCount');
      if (!numEl || !wrapEl) return;
      var catId = schedulePhoneCatId || '100001';
      try {
        var r = await api('/api/order-list', {
          method: 'POST',
          body: JSON.stringify({
            userId: authUserId,
            categoryBrands: [{ key: catId, value: [] }],
            orderState: '30',
            subOrderSourceNames: [],
            pageIndex: 1,
            pageSize: 10
          })
        });
        if (r.success && r.data) {
          var total = r.data.totalCount !== undefined ? r.data.totalCount : (r.data.pageCount !== undefined ? r.data.pageCount : 0);
          scheduleGrabbedCountValue = total;
          if (total > 0) {
            numEl.textContent = total;
            numEl.className = 'schedule-grabbed-num-link';
            numEl.title = '点击跳转到抢单列表（已报价）';
          } else {
            numEl.textContent = '0';
            numEl.className = '';
            numEl.title = '';
          }
        } else {
          scheduleGrabbedCountValue = 0;
          numEl.textContent = '0';
          numEl.className = '';
        }
      } catch (_) {
        scheduleGrabbedCountValue = 0;
        numEl.textContent = '0';
        numEl.className = '';
      }
    }
    function goToGrabListQuoted() {
      document.querySelectorAll('.tab-nav-item').forEach(function (n) { n.classList.remove('active'); });
      var grabTab = document.querySelector('.tab-nav-item[data-tab="grab"]');
      if (grabTab) { grabTab.classList.add('active'); }
      document.getElementById('tabPanelGrab').classList.remove('hidden');
      document.getElementById('tabPanelSchedule').classList.add('hidden');
      var radio = document.querySelector('input[name="orderState"][value="30"]');
      if (radio) { radio.checked = true; doQueryOrders(); }
    }
    document.getElementById('scheduleGrabbedCount').addEventListener('click', function (e) {
      if (e.target.id === 'scheduleGrabbedCountNum' && scheduleGrabbedCountValue > 0) goToGrabListQuoted();
    });
    function updateScheduleGrabbedCountTimer() {
      if (scheduleGrabbedCountTimer) {
        clearInterval(scheduleGrabbedCountTimer);
        scheduleGrabbedCountTimer = null;
      }
      var runningIds = Object.keys(scheduleTaskTimers);
      if (runningIds.length === 0) return;
      var minSec = Infinity;
      runningIds.forEach(function (id) {
        var task = scheduledTasks.find(function (t) { return t.id === Number(id); });
        if (task) {
          var sec = Math.max(1, parseInt(task.frequency, 10) || 1);
          if (sec < minSec) minSec = sec;
        }
      });
      if (minSec === Infinity) return;
      loadScheduleGrabbedCount();
      scheduleGrabbedCountTimer = setInterval(loadScheduleGrabbedCount, minSec * 1000);
    }
    function stopAllScheduleTimers() {
      var id;
      for (id in scheduleTaskTimers) {
        if (scheduleTaskTimers.hasOwnProperty(id)) {
          clearInterval(scheduleTaskTimers[id]);
        }
      }
      scheduleTaskTimers = {};
      if (scheduleGrabbedCountTimer) {
        clearInterval(scheduleGrabbedCountTimer);
        scheduleGrabbedCountTimer = null;
      }
      renderScheduleTaskList();
    }
    renderScheduleTaskList();
    document.getElementById('categoryRadioGroup').addEventListener('change', function (e) {
      if (e.target.name === 'categoryType' && e.target.checked) loadBrandsForCategory(e.target.value);
    });
    document.getElementById('btnBrandsAll').onclick = function () {
      var checkboxes = document.querySelectorAll('#brandsList input[type="checkbox"]');
      if (!checkboxes.length) return;
      var allChecked = [].slice.call(checkboxes).every(function (cb) { return cb.checked; });
      checkboxes.forEach(function (cb) { cb.checked = !allChecked; });
    };
    var btnManAll = document.getElementById('btnManufacturersAll');
    if (btnManAll) {
      btnManAll.onclick = function () {
        var checkboxes = document.querySelectorAll('#manufacturersList input[type="checkbox"]');
        if (!checkboxes.length) return;
        var allChecked = [].slice.call(checkboxes).every(function (cb) { return cb.checked; });
        checkboxes.forEach(function (cb) { cb.checked = !allChecked; });
      };
    }
    document.getElementById('orderListBody').addEventListener('click', function (e) {
      var cell = e.target.closest('.order-list-copy-cell');
      if (!cell) return;
      var t = (cell.textContent || '').trim();
      if (t && t !== '-') { copyToClipboard(t); showToast('复制 ' + t + ' 成功', 'success', { highlight: t }); return; }
    });
    document.getElementById('orderListBody').addEventListener('click', async function (e) {
      var copyModelBtn = e.target.closest('.btn-copy-model');
      if (copyModelBtn) {
        var model = copyModelBtn.getAttribute('data-model');
        if (model && model !== '-') { copyToClipboard(model); showToast('复制 ' + model + ' 成功', 'success', { highlight: model }); }
        return;
      }
      var btn = e.target.closest('button[data-record-id]');
      if (!btn) return;
      var recordId = btn.dataset.recordId;
      var orderId = btn.dataset.orderId;
      var orderState = String(btn.dataset.orderState || '').trim();
      hideMsg(document.getElementById('orderListMsg'));
      function openQuoteModal() {
        document.getElementById('quoteRecordId').value = recordId;
        document.getElementById('quoteOrderId').value = orderId;
        document.getElementById('quoteProductName').textContent = btn.dataset.productName || '-';
        document.getElementById('quoteBrand').textContent = btn.dataset.brand || '-';
        document.getElementById('quoteModel').textContent = btn.dataset.model || '-';
        document.getElementById('quoteStorage').textContent = btn.dataset.storage || '-';
        document.getElementById('quoteApprizeDisplay').textContent = btn.dataset.apprizeDisplay || '-';
        document.getElementById('quoteApprizeValue').value = btn.dataset.apprize || '';
        var ap = (btn.dataset.actualPrice || '').trim();
        document.getElementById('quoteActualPrice').value = (ap === '' || ap === '0') ? '' : ap;
        document.getElementById('quoteRemark').value = '';
        document.getElementById('quoteIsUpdate').value = (orderState === '30') ? '1' : '';
        document.getElementById('quoteMsg').classList.add('hidden');
        document.getElementById('quoteModal').classList.remove('hidden');
        var has = function (v) { var s = (v || '').trim(); return s && s !== '-'; };
        var nameBtn = document.querySelector('.btn-copy-quote-name');
        if (nameBtn) nameBtn.classList.toggle('hidden', !has(btn.dataset.productName));
        var brandBtn = document.querySelector('.btn-copy-quote-field[data-target="quoteBrand"]');
        if (brandBtn) brandBtn.classList.toggle('hidden', !has(btn.dataset.brand));
        var modelBtn = document.querySelector('.btn-copy-quote-field[data-target="quoteModel"]');
        if (modelBtn) modelBtn.classList.toggle('hidden', !has(btn.dataset.model));
        var storageBtn = document.querySelector('.btn-copy-quote-field[data-target="quoteStorage"]');
        if (storageBtn) storageBtn.classList.toggle('hidden', !has(btn.dataset.storage));
      }
      if (orderState === '20' || orderState === '30') { openQuoteModal(); return; }
      try {
        var r = await api('/api/grab-order', { method: 'POST', body: JSON.stringify({ recordId: recordId, orderId: orderId, userId: authUserId }) });
        if (!r.success) { showToast(r.message || '抢单失败', 'error'); return; }
        showToast('抢单成功', 'success');
        openQuoteModal();
      } catch (err) { showToast(String(err), 'error'); }
    });
    document.getElementById('btnQuoteCancel').onclick = function () {
      document.getElementById('quoteModal').classList.add('hidden');
      doQueryOrders();
    };
    document.addEventListener('keydown', function (e) {
      var modal = document.getElementById('quoteModal');
      if (!modal || modal.classList.contains('hidden')) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        document.getElementById('btnQuoteCancel').click();
      } else if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('btnQuoteSubmit').click();
      }
    });
    document.querySelector('.btn-copy-quote-name').onclick = function () {
      var t = document.getElementById('quoteProductName').textContent;
      if (t && t !== '-') { copyToClipboard(t); showToast('已复制产品名称', 'success'); }
    };
    document.getElementById('quoteModal').addEventListener('click', function (e) {
      var btn = e.target.closest('.btn-copy-quote-field');
      if (!btn) return;
      var id = btn.getAttribute('data-target');
      var el = id ? document.getElementById(id) : null;
      if (!el) return;
      var t = (el.textContent || '').trim();
      if (!t || t === '-') return;
      copyToClipboard(t);
      showToast('已复制', 'success');
    });
    var maxQuoteAmount = 500;
    (function () {
      var hint = document.getElementById('maxQuoteAmountHint');
      var checkEl = document.getElementById('maxQuoteCheck');
      if (hint) hint.textContent = '已设置：报价不得超过 500 元';
      if (checkEl) checkEl.classList.remove('hidden');
    })();
    document.getElementById('quoteActualPrice').addEventListener('input', function () {
      this.value = this.value.replace(/[^\d]/g, '');
    });
    document.getElementById('btnQuoteSubmit').onclick = async function () {
      var recordId = document.getElementById('quoteRecordId').value.trim();
      var orderId = document.getElementById('quoteOrderId').value.trim();
      var actualPrice = document.getElementById('quoteActualPrice').value.trim();
      var remark = document.getElementById('quoteRemark').value.trim();
      var isUpdate = document.getElementById('quoteIsUpdate').value === '1';
      var msg = document.getElementById('quoteMsg');
      if (!recordId || !orderId || !actualPrice) { showMsg(msg, '请填写报价金额', 'error'); return; }
      var priceNum = parseFloat(actualPrice);
      if (isNaN(priceNum) || priceNum <= 0) { showMsg(msg, '报价金额必须大于0', 'error'); return; }
      if (maxQuoteAmount != null && priceNum > maxQuoteAmount) { showMsg(msg, '报价金额不能超过已设置的最大报价 ' + maxQuoteAmount + ' 元', 'error'); return; }
      var apprizeVal = document.getElementById('quoteApprizeValue').value.trim();
      var apprizeNum = apprizeVal ? parseFloat(apprizeVal) : NaN;
      if (typeof apprizeNum === 'number' && !Number.isNaN(apprizeNum) && apprizeNum > 0 && priceNum >= apprizeNum * 1.5) {
        if (!confirm('报价金额已超过预估金额的1.5倍，确定要提交报价吗？')) return;
      }
      try {
        var url = isUpdate ? '/api/update-quote' : '/api/quote';
        var body = isUpdate
          ? { recordId: Number(recordId), orderId: Number(orderId), actualPrice: actualPrice, remark: remark, userId: authUserId }
          : { recordId: Number(recordId), orderId: Number(orderId), quoteResult: 1, actualPrice: actualPrice, remark: remark, userId: authUserId };
        var r = await api(url, { method: 'POST', body: JSON.stringify(body) });
        if (r.success) {
          document.getElementById('quoteModal').classList.add('hidden');
          showToast(isUpdate ? '修改报价成功' : '报价成功', 'success');
          doQueryOrders();
        } else {
          showMsg(msg, r.message || (isUpdate ? '修改报价失败' : '报价失败'), 'error');
        }
      } catch (e) { showMsg(msg, String(e), 'error'); }
    };
    checkStatus();
  </script>
</body>

</html>
